<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Personal Growth Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

  <div class="app">

    <!-- ===== Assessment Section ===== -->
    <section id="assessment" class="card">
      <h2>ارزیابی اولیه</h2>
      <p class="subtitle">به هر سؤال از ۱ تا ۱۰ امتیاز بده</p>

      <div id="question-box"></div>

      <div class="actions">
        <button id="next-question">سؤال بعدی</button>
      </div>
    </section>

    <!-- ===== Coach Section ===== -->
    <section id="coach" class="card hidden">
      <h2>Coach</h2>
      <div id="coach-chat"></div>

      <div class="actions hidden" id="coach-action">
        <button id="go-to-program">بریم تو برنامه</button>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
